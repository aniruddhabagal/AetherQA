version: "3.9"

services:
  aetherqa:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MEM0_API_KEY=${MEM0_API_KEY}
      - DATABASE_URL=postgresql://qa:qa@postgres:5432/agentic_qa
      - DEFAULT_TARGET_URL=${DEFAULT_TARGET_URL:-https://staging.yourapp.com}
      - DASHBOARD_SECRET=${DASHBOARD_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_DEFAULT_BRANCH=${GITHUB_DEFAULT_BRANCH:-main}
      - GITHUB_MCP_URL=http://github-mcp:8080/sse
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests        # persists generated tests & auth state
      - ./runs:/app/runs          # persists screenshots & traces

  dashboard:
    build: ./dashboard
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://aetherqa:4000
      - VITE_DEFAULT_URL=${DEFAULT_TARGET_URL:-https://staging.yourapp.com}

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: agentic_qa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d agentic_qa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # GitHub MCP sidecar — Week 3, uncomment when ready
  # github-mcp:
  #   image: ghcr.io/github/github-mcp-server:latest
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN}

volumes:
  pgdata:
